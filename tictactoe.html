<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body class="game-page">

<div class="back-button">
  <button onclick="window.location.href='index.html'">
    <i class="fas fa-arrow-left"></i> Back
  </button>
</div>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
  <i class="fas fa-moon moon-icon"></i>
  <i class="fas fa-sun sun-icon"></i>
</button>

<div class="tictactoe-game-container">

  
  <div class="tictactoe-left">
    <h2>Tic Tac Toe</h2>
    <div class="turn-indicator" id="turnIndicator">Your Turn (X)</div>
    <div id="gameArea" class="ttt-grid-area"></div>
  </div>

  
  <div class="tictactoe-right">
    <div class="controls-card">
      <h3>Difficulty</h3>
      <div class="difficulty-buttons">
        <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
        <button class="difficulty-btn" data-difficulty="medium">Medium</button>
        <button class="difficulty-btn" data-difficulty="hard">Hard</button>
      </div>

      <button class="new-game-btn" onclick="startTicTacToe()">
        <i class="fas fa-redo"></i> New Game
      </button>
    </div>

    <div class="stats-card">
      <h3>Game Info</h3>
      <div class="game-info">
        <p>🎯 You play as <strong>X</strong></p>
        <p>🤖 Bot plays as <strong>O</strong></p>
        <p>📊 First to 3 in a row wins!</p>
      </div>
    </div>
  </div>

</div>

<script>
  document.getElementById('themeToggle').addEventListener('click', function() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
</script>
<script src="games.js"></script>
</body>
</html>

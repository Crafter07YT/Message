<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
    // Load saved theme early to avoid a flash of wrong colors
    (function() {
      const t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body class="game-page">

<div class="back-button">
  <button onclick="window.location.href='index.html'">
    <i class="fas fa-arrow-left"></i> Back
  </button>
</div>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
  <i class="fas fa-moon moon-icon"></i>
  <i class="fas fa-sun sun-icon"></i>
</button>

<div class="sudoku-container">

    <div class="sudoku-left">
    <h2>Sudoku</h2>
    <div id="gameArea" class="sudoku-grid-area"></div>
    <div id="sudokuNumbers" class="sudoku-numbers"></div>
  </div>

    <div class="sudoku-right">
    <div class="stats-card">
      <h3>Statistics</h3>

      <div class="stat-item">
        <span class="stat-label">Time</span>
        <span class="stat-value"><span id="sudokuCurrentTime">0</span>s</span>
      </div>

      <div class="stat-item">
        <span class="stat-label">Best Time</span>
        <span class="stat-value"><span id="bestTime">--</span>s</span>
      </div>

      <div class="stat-item">
        <span class="stat-label">Lives</span>
        <span class="stat-value" id="livesDisplay">❤️❤️❤️</span>
      </div>
    </div>

    <div class="controls-card">
      <h3>Difficulty</h3>
      <div class="difficulty-buttons">
        <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
        <button class="difficulty-btn" data-difficulty="medium">Medium</button>
        <button class="difficulty-btn" data-difficulty="hard">Hard</button>
      </div>

      <button class="new-game-btn" onclick="startSudoku()">
        <i class="fas fa-redo"></i> New Game
      </button>
    </div>
  </div>

</div>

<script>
  document.getElementById('themeToggle').addEventListener('click', function() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
</script>
<script src="games.js"></script>
</body>
</html>
